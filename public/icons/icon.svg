<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Arbeidskart">
  <defs>
    <linearGradient id="bg" x1="128" y1="0" x2="384" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="55%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="hat" x1="256" y1="72" x2="256" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="map" x1="120" y1="260" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtil kant -->
  <rect
    x="8"
    y="8"
    width="496"
    height="496"
    rx="100"
    fill="none"
    stroke="#27272a"
    stroke-width="2"
  />

  <!-- Topografiske kurver -->
  <g fill="none" stroke="#365314" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <path d="M56 388 C140 356 220 372 256 380 C292 388 372 364 456 392"/>
    <path d="M40 428 C160 400 236 416 256 422 C276 428 352 408 472 432"/>
    <path d="M80 352 C176 320 252 336 316 344 C380 352 420 332 448 348"/>
  </g>

  <!-- Kartflate -->
  <g filter="url(#glow)">
    <path fill="url(#map)" d="M112 272 388 254 398 434 122 452Z"/>
    <path fill="#18181b" d="M112 272 158 266 168 452 122 452Z"/>
    <g stroke="#52525b" stroke-width="2" opacity="0.8">
      <line x1="192" y1="282" x2="384" y2="266"/>
      <line x1="186" y1="332" x2="390" y2="316"/>
      <line x1="180" y1="382" x2="396" y2="366"/>
      <line x1="240" y1="276" x2="228" y2="444"/>
      <line x1="314" y1="268" x2="302" y2="438"/>
    </g>
    <path
      d="M180 392 C232 348 280 364 324 336 C356 316 368 304 380 292"
      fill="none"
      stroke="#a3e635"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />
    <circle cx="380" cy="292" r="18" fill="#a3e635"/>
    <circle cx="380" cy="292" r="7" fill="#18181b"/>
    <!-- Kompass -->
    <g transform="translate(214 334)">
      <circle cx="0" cy="0" r="32" fill="#18181b" stroke="#52525b" stroke-width="3"/>
      <path d="M0 -22 L7 9 L0 4 L-7 9 Z" fill="#a3e635"/>
      <path d="M0 22 L7 -9 L0 -4 L-7 -9 Z" fill="#52525b"/>
      <circle cx="0" cy="0" r="4" fill="#71717a"/>
    </g>
  </g>

  <!-- Vernhjelm -->
  <g filter="url(#glow)">
    <ellipse cx="256" cy="216" rx="132" ry="26" fill="#09090b"/>
    <path fill="url(#hat)" d="M124 208 C124 96 256 68 388 208 Z"/>
    <path fill="#09090b" opacity="0.35" d="M246 74 H266 V208 H246 Z"/>
    <!-- Hi-vis stripe (dempet) -->
    <path
      fill="#a3e635"
      opacity="0.85"
      d="M156 168 Q256 148 356 168 L348 188 Q256 168 164 188 Z"
    />
    <ellipse cx="208" cy="124" rx="36" ry="20" fill="#fff" opacity="0.08"/>
  </g>
</svg>
